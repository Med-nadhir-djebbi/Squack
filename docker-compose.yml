services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: squack
      POSTGRES_USER: squack
      POSTGRES_PASSWORD: squack
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squack -d squack"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://squack:squack@postgres:5432/squack?schema=public
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN_SECONDS: 3600
      CORS_ORIGINS: http://localhost:5173
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - squack-uploads:/app/apps/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
        VITE_GRAPHQL_URL: http://localhost:3000/graphql
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  postgres-data:
  squack-uploads:
