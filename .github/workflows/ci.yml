name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image : postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: squack
        ports:
          - 5432:5432
        options: 
          --health-cmd "pg_isready -U test -d squack"
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/squack?schema=public&pgbouncer=true&sslmode=disable
      JWT_SECRET: hire-me-im-good-for-this-job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=apps/backend
      - run: npm run prisma:migrate --workspace=apps/backend
      - run: npm run check
      - run: npm audit --audit-level=moderate
